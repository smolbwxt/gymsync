name: iOS

on:
  push:
    paths:
      - "GymSyncApp/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "GymSyncApp/**"
      - ".github/workflows/ios.yml"

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Must run BEFORE xcodegen: generated project only includes files that exist at generate time.
      # Real values come from repo secrets (absent on fork PRs -> template placeholders, network tests skip).
      - name: Write Secrets.swift and TestSecrets.swift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            printf 'import Foundation\n\nenum Secrets {\n    static let supabaseURL = URL(string: "%s")!\n    static let supabaseAnonKey = "%s"\n}\n' \
              "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > GymSyncApp/GymSync/Config/Secrets.swift
          else
            cp GymSyncApp/GymSync/Config/Secrets.swift.template GymSyncApp/GymSync/Config/Secrets.swift
          fi
          if [ -n "$TEST_USER_EMAIL" ]; then
            printf 'import Foundation\n\nenum TestSecrets {\n    static let testUserEmail = "%s"\n    static let testUserPassword = "%s"\n}\n' \
              "$TEST_USER_EMAIL" "$TEST_USER_PASSWORD" > GymSyncApp/GymSyncTests/TestSecrets.swift
          else
            cp GymSyncApp/GymSyncTests/TestSecrets.swift.template GymSyncApp/GymSyncTests/TestSecrets.swift
          fi

      - name: Generate Xcode project from project.yml
        run: xcodegen generate --spec GymSyncApp/project.yml --project GymSyncApp

      - name: Build and test
        working-directory: GymSyncApp
        run: |
          # NOTE: do not disable code signing — unsigned simulator bundles lack
          # keychain entitlements and supabase-swift silently loses its session.
          # Pick the first available iPhone simulator; fall back to any simulator.
          # simctl output: "    iPhone 16 (UDID) (Shutdown)"
          # We extract the first UUID-looking group (8-4-4-4-12 hex chars).
          DEST=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 \
            | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          if [ -z "$DEST" ]; then
            DEST=$(xcrun simctl list devices available | grep -v '^==' | grep '(' | head -1 \
              | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          fi
          echo "Using simulator UDID: $DEST"
          xcodebuild test \
            -project GymSync.xcodeproj \
            -scheme GymSync \
            -destination "id=$DEST"

  deploy-testflight:
    runs-on: macos-15
    timeout-minutes: 45
    needs: build-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # App Store Connect rejects uploads built with SDKs older than iOS 26.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Must run BEFORE xcodegen (source list fixed at generate time).
      # TestSecrets stub keeps the project generatable; test target isn't built for archive.
      - name: Write Secrets.swift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf 'import Foundation\n\nenum Secrets {\n    static let supabaseURL = URL(string: "%s")!\n    static let supabaseAnonKey = "%s"\n}\n' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > GymSyncApp/GymSync/Config/Secrets.swift
          cp GymSyncApp/GymSyncTests/TestSecrets.swift.template GymSyncApp/GymSyncTests/TestSecrets.swift

      - name: Generate Xcode project from project.yml
        run: xcodegen generate --spec GymSyncApp/project.yml --project GymSyncApp

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_API_KEY" > ~/private_keys/AuthKey_57G3DK86PA.p8

      - name: Archive (automatic signing via ASC API key)
        working-directory: GymSyncApp
        run: |
          xcodebuild archive \
            -project GymSync.xcodeproj \
            -scheme GymSync \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GymSync.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_57G3DK86PA.p8" \
            -authenticationKeyID 57G3DK86PA \
            -authenticationKeyIssuerID d0ee236a-ef18-498e-8d99-26b47c70d4f0 \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # ExportOptions.plist has destination:upload — this step also uploads to TestFlight.
      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GymSync.xcarchive" \
            -exportOptionsPlist GymSyncApp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_57G3DK86PA.p8" \
            -authenticationKeyID 57G3DK86PA \
            -authenticationKeyIssuerID d0ee236a-ef18-498e-8d99-26b47c70d4f0
