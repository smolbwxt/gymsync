name: iOS

on:
  push:
    paths:
      - "GymSyncApp/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "GymSyncApp/**"
      - ".github/workflows/ios.yml"
  # Manual trigger — lets the controller/user run a build+deploy without a
  # code change (e.g. to bake a newly-added GH secret like SENTRY_DSN into a
  # fresh build, or re-deploy master). deploy-testflight's own `if:` still
  # gates it to master, so a dispatch off any other ref build-tests only.
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same Xcode the deploy job archives with (owner 2026-08-22):
      # the default Xcode has no FoundationModels, so the Coach
      # conversation adapter was only ever compiled at deploy time -
      # the ToolOutput bug hid there until the first master push.
      # One toolchain everywhere closes the blind spot; the simulator
      # picker below is name-agnostic, so it follows the selection.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Must run BEFORE xcodegen: generated project only includes files that exist at generate time.
      # Real values come from repo secrets (absent on fork PRs -> template placeholders, network tests skip).
      - name: Write Secrets.swift and TestSecrets.swift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # SENTRY_DSN is deliberately NOT passed to the simulator jobs
          # (Sentry triage 2026-08-31). It used to be, and the cost was
          # severe: 2,062 of the project's 2,072 lifetime events — and 474
          # of its 475 "users" — were GitHub Actions simulators, since every
          # CI run installs fresh and mints a new anonymous install id. The
          # real-device signal (10 events in 90 days) sat under 99.5% noise,
          # and the event quota paid for it. An unset var expands empty
          # below, which CrashReporting.start(dsn:) treats as "disabled" on
          # a provably-no-op path (Services/CrashReporting.swift, asserted
          # by CrashReportingTests' call-count fake). Only deploy-testflight
          # — the job that ships to real devices — still receives the DSN.
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            printf 'import Foundation\n\nenum Secrets {\n    static let supabaseURL = URL(string: "%s")!\n    static let supabaseAnonKey = "%s"\n    static let sentryDSN = "%s"\n}\n' \
              "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" "$SENTRY_DSN" > GymSyncApp/GymSync/Config/Secrets.swift
          else
            cp GymSyncApp/GymSync/Config/Secrets.swift.template GymSyncApp/GymSync/Config/Secrets.swift
          fi
          if [ -n "$TEST_USER_EMAIL" ]; then
            printf 'import Foundation\n\nenum TestSecrets {\n    static let testUserEmail = "%s"\n    static let testUserPassword = "%s"\n}\n' \
              "$TEST_USER_EMAIL" "$TEST_USER_PASSWORD" > GymSyncApp/GymSyncTests/TestSecrets.swift
          else
            cp GymSyncApp/GymSyncTests/TestSecrets.swift.template GymSyncApp/GymSyncTests/TestSecrets.swift
          fi

      - name: Generate Xcode project from project.yml
        run: xcodegen generate --spec GymSyncApp/project.yml --project GymSyncApp

      - name: Build and test
        working-directory: GymSyncApp
        run: |
          # NOTE: do not disable code signing — unsigned simulator bundles lack
          # keychain entitlements and supabase-swift silently loses its session.
          # Pick the first available iPhone simulator; fall back to any simulator.
          # simctl output: "    iPhone 16 (UDID) (Shutdown)"
          # We extract the first UUID-looking group (8-4-4-4-12 hex chars).
          DEST=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 \
            | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          if [ -z "$DEST" ]; then
            DEST=$(xcrun simctl list devices available | grep -v '^==' | grep '(' | head -1 \
              | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          fi
          echo "Using simulator UDID: $DEST"
          # Fast-fail retry (2026-08-20): two consecutive runs died in
          # under 3 minutes to runner infrastructure — an xcodebuild
          # SIGSEGV at destination selection, then a corrupt SPM PIF
          # cache — before compiling anything. Real compile/test failures
          # take 20+ minutes here, so a failure faster than 5 minutes is
          # near-certainly infrastructure: clear DerivedData and retry
          # once. Slow failures propagate immediately — genuine breakage
          # never pays a double run.
          run_tests() {
            xcodebuild test \
              -project GymSync.xcodeproj \
              -scheme GymSync \
              -destination "id=$DEST"
          }
          START=$(date +%s)
          if run_tests; then exit 0; fi
          ELAPSED=$(( $(date +%s) - START ))
          if [ "$ELAPSED" -lt 300 ]; then
            echo "::warning::xcodebuild failed in ${ELAPSED}s — infra-class failure, clearing caches and retrying once"
            rm -rf ~/Library/Developer/Xcode/DerivedData
            run_tests
          else
            exit 1
          fi

  # CI simulator-screenshot pipeline (infra/ci-screenshots): builds the
  # GymSyncScreenshots scheme (GymSyncUITests only — never the unit-test
  # scheme above) and uploads the screenshots each test method attaches via
  # XCTAttachment as a workflow artifact, so a reviewer/agent can visually
  # verify a build against design proofs without a Mac. `continue-on-error`
  # at the job level: this pipeline is new and screenshot flakiness (network
  # timing, simulator quirks) must not block merges while it's hardened —
  # the artifact existing is the goal, not this job's pass/fail status.
  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    needs: build-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Same Xcode the deploy job archives with (owner 2026-08-22):
      # the default Xcode has no FoundationModels, so the Coach
      # conversation adapter was only ever compiled at deploy time -
      # the ToolOutput bug hid there until the first master push.
      # One toolchain everywhere closes the blind spot; the simulator
      # picker below is name-agnostic, so it follows the selection.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Same as build-test: must run BEFORE xcodegen. TEST_USER_EMAIL/
      # PASSWORD here double as the UITEST_EMAIL/PASSWORD launch-environment
      # values passed to the `xcodebuild test` step below (same ci_test_user_2
      # account GymSyncTests already signs in as).
      - name: Write Secrets.swift and TestSecrets.swift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # SENTRY_DSN is deliberately NOT passed to the simulator jobs
          # (Sentry triage 2026-08-31). It used to be, and the cost was
          # severe: 2,062 of the project's 2,072 lifetime events — and 474
          # of its 475 "users" — were GitHub Actions simulators, since every
          # CI run installs fresh and mints a new anonymous install id. The
          # real-device signal (10 events in 90 days) sat under 99.5% noise,
          # and the event quota paid for it. An unset var expands empty
          # below, which CrashReporting.start(dsn:) treats as "disabled" on
          # a provably-no-op path (Services/CrashReporting.swift, asserted
          # by CrashReportingTests' call-count fake). Only deploy-testflight
          # — the job that ships to real devices — still receives the DSN.
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            printf 'import Foundation\n\nenum Secrets {\n    static let supabaseURL = URL(string: "%s")!\n    static let supabaseAnonKey = "%s"\n    static let sentryDSN = "%s"\n}\n' \
              "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" "$SENTRY_DSN" > GymSyncApp/GymSync/Config/Secrets.swift
          else
            cp GymSyncApp/GymSync/Config/Secrets.swift.template GymSyncApp/GymSync/Config/Secrets.swift
          fi
          if [ -n "$TEST_USER_EMAIL" ]; then
            printf 'import Foundation\n\nenum TestSecrets {\n    static let testUserEmail = "%s"\n    static let testUserPassword = "%s"\n}\n' \
              "$TEST_USER_EMAIL" "$TEST_USER_PASSWORD" > GymSyncApp/GymSyncTests/TestSecrets.swift
          else
            cp GymSyncApp/GymSyncTests/TestSecrets.swift.template GymSyncApp/GymSyncTests/TestSecrets.swift
          fi

      - name: Generate Xcode project from project.yml
        run: xcodegen generate --spec GymSyncApp/project.yml --project GymSyncApp

      # Seeds a deterministic fixture world (group, sessions, chat, friends,
      # routine library, featured routine) into the CI test account so app
      # captures below reflect populated states instead of empty ones.
      #
      # The guard was written for fork PRs (no repo secrets there) and was
      # silently swallowing a MISSING SECRET on trusted refs: neither
      # SUPABASE_SECRET_KEY nor CI_TEST_USERNAME has ever been added to this
      # repo's secrets, so this step has never actually seeded anything — it
      # "succeeded" in 0 s on every run, and every deep capture below has
      # been navigating whatever residue was left in the live account.
      # Fork PRs still skip quietly; a non-fork ref now says so loudly, in
      # the log AND in the job summary.
      - name: Seed QA fixture world
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CI_TEST_USERNAME: ${{ secrets.CI_TEST_USERNAME }}
          # `null || false` for push/dispatch events, where there is no PR.
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork || false }}
          # seed_qa_fixtures.js uses only node builtins — skip puppeteer's
          # ~150MB Chromium download here (the parity job below needs it,
          # this one doesn't).
          PUPPETEER_SKIP_DOWNLOAD: 1
        run: |
          if [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$CI_TEST_USERNAME" ]; then
            trap 'rm -f .env.local' EXIT
            printf 'SUPABASE_URL=%s\nSUPABASE_SECRET_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_SECRET_KEY" > .env.local
            npm ci
            node scripts/seed_qa_fixtures.js --username "$CI_TEST_USERNAME"
            rm -f .env.local
          elif [ "$IS_FORK_PR" = "true" ]; then
            echo "No SUPABASE_SECRET_KEY (fork PR) — skipping seed; captures will show empty states."
          else
            # TODO(owner): flip to exit 1 once SUPABASE_SECRET_KEY and
            # CI_TEST_USERNAME are in repo secrets. Warning, not failure,
            # deliberately: a hard fail today would stop EVERY capture until
            # the secrets exist, and the captures are the medium.
            echo "::warning::QA seed skipped on a non-fork ref: SUPABASE_SECRET_KEY and/or CI_TEST_USERNAME is not set in repo secrets. Deep captures (chat, lobby, recap, ledger, group stats, friends, routine detail) are navigating stale account residue, not a deterministic fixture world."
            {
              echo '### :warning: QA fixture seed skipped'
              echo ''
              echo 'Add these repo secrets to make the deep captures deterministic:'
              echo ''
              echo '- `SUPABASE_SECRET_KEY`'
              echo '- `CI_TEST_USERNAME`'
              echo ''
              echo 'Until then the seeded screens navigate whatever residue is in the live CI account.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run screenshot UI tests
        working-directory: GymSyncApp
        # TEST_RUNNER_ prefix required: xcodebuild does NOT pass its own
        # environment into the UI test runner process on the simulator. It
        # strips this prefix and injects the remainder (UITEST_EMAIL/
        # UITEST_PASSWORD) into the runner, where ScreenshotTests reads
        # ProcessInfo and forwards them via launchEnvironment. Without the
        # prefix the app sits at Sign in with Apple and every test times out
        # (run 29297982021).
        env:
          TEST_RUNNER_UITEST_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_RUNNER_UITEST_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          # PINNED BY NAME, unlike build-test's `head -1`. The capture device
          # decides the capture RESOLUTION, and every parity diff is computed
          # against it — a runner-image refresh that reorders `simctl list`
          # would silently shift every frame in the design-review artifact.
          # Falls back to the first available iPhone (and says so) rather than
          # failing, so a future image that drops this model still produces
          # captures.
          # EVERY grep below is `|| true`, and that is load-bearing, not
          # defensive noise: GitHub runs this block under
          # `bash --noprofile --norc -eo pipefail`, so a `grep` that matches
          # nothing exits 1, `pipefail` carries that past `head -1` into the
          # `SIM_LINE=$(…)` assignment, and `set -e` kills the step — on
          # exactly the line the fallback below exists for. Without `|| true`
          # the fallback is unreachable dead code and the step dies having
          # printed nothing at all. (Reproduced by the task reviewer.)
          PREFERRED_SIM="iPhone 16 Pro"
          DEVICES=$(xcrun simctl list devices available)
          # The trailing " (" pins the match to the exact model: "iPhone 16 Pro"
          # alone would also match "iPhone 16 Pro Max".
          SIM_LINE=$(echo "$DEVICES" | grep -F "$PREFERRED_SIM (" | head -1 || true)
          if [ -z "$SIM_LINE" ]; then
            echo "::warning::$PREFERRED_SIM is not available on this runner image — falling back to the first available iPhone; capture resolution may differ from the parity baseline."
            SIM_LINE=$(echo "$DEVICES" | grep -E 'iPhone' | head -1 || true)
          fi
          if [ -z "$SIM_LINE" ]; then
            SIM_LINE=$(echo "$DEVICES" | grep -v '^==' | grep '(' | head -1 || true)
          fi
          DEST=$(echo "$SIM_LINE" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1 || true)
          echo "Using simulator: $(echo "$SIM_LINE" | sed 's/^[[:space:]]*//')"
          echo "Using simulator UDID: $DEST"
          # `|| true` above removed the (accidental) `set -e` stop, so an
          # unresolvable device must now fail on purpose — otherwise
          # xcodebuild is handed `-destination "id="` and reports something
          # far less obvious.
          if [ -z "$DEST" ]; then
            echo "::error::No simulator UDID could be resolved. Available devices were:"
            echo "$DEVICES"
            exit 1
          fi
          xcodebuild test \
            -project GymSync.xcodeproj \
            -scheme GymSyncScreenshots \
            -destination "id=$DEST" \
            -resultBundlePath "$RUNNER_TEMP/shots.xcresult"

      # `if: always()` on this and the upload step below: one flaky/failing
      # tab screenshot must not swallow the screenshots successfully
      # attached by every OTHER test method in the same xcresult bundle.
      - name: Export screenshot attachments
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screens"
          if [ -d "$RUNNER_TEMP/shots.xcresult" ] && xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/shots.xcresult" \
            --output-path "$RUNNER_TEMP/screens"; then
            echo "Exported via 'xcresulttool export attachments'"
          else
            echo "'xcresulttool export attachments' unavailable or failed on this Xcode version — falling back to xcparse"
            brew install chargepoint/xcparse/xcparse
            xcparse attachments "$RUNNER_TEMP/shots.xcresult" "$RUNNER_TEMP/screens" || true
          fi
          echo "Exported files:"
          ls -la "$RUNNER_TEMP/screens" || true

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn

      # Guards the MEDIUM. `continue-on-error: true` on this job plus
      # `if: always()` on the two steps above means a suite that failed 40 of
      # its 75 methods still publishes a green-looking `app-screenshots`
      # artifact, and nobody is told the design-review medium degraded. This
      # is the floor that closes that. It runs AFTER the upload deliberately:
      # a failure here must not cost us the partial artifact that explains
      # why the count dropped.
      #
      # Counts the way the downstream parity job does — by the attachment's
      # `suggestedHumanReadableName` in manifest.json, because xcresulttool
      # writes the files themselves under UUID names and only
      # scripts/rename_app_shots.js turns them back into `app-<id>.png`. The
      # on-disk `app-*` count is tried first for the xcparse fallback path,
      # which names files after the attachment.
      - name: Verify capture count
        if: always()
        run: |
          SCREENS="$RUNNER_TEMP/screens"
          FLOOR=87
          # `|| true` + the `:-0` default for the same `set -eo pipefail`
          # reason as the simulator picker above: a missing $SCREENS makes
          # `find` exit 1, which would kill the step before it printed the
          # count the plan asks for either way. Masked today by the export
          # step's `mkdir -p`, but the guard is free.
          COUNT=$(find "$SCREENS" -maxdepth 1 -type f -name 'app-*' 2>/dev/null | wc -l | tr -d ' ' || true)
          COUNT=${COUNT:-0}
          if [ "$COUNT" -eq 0 ] && [ -f "$SCREENS/manifest.json" ]; then
            COUNT=$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const ts=Array.isArray(m)?m:[];let n=0;for(const t of ts)for(const a of (t.attachments||[]))if(String(a.suggestedHumanReadableName||'').startsWith('app-'))n++;console.log(n);" "$SCREENS/manifest.json" || echo 0)
          fi
          COUNT=${COUNT:-0}
          echo "app captures exported: $COUNT (floor: $FLOOR)"
          if [ "$COUNT" -lt "$FLOOR" ]; then
            echo "::error::Only $COUNT app captures were exported (floor $FLOOR). The screenshot suite degraded — check the test failures in 'Run screenshot UI tests' above; the partial artifact is still attached to this run."
            exit 1
          fi

  # Design-parity harness: renders the design canvas's proof frames, diffs
  # them against the app-screenshots artifact from the `screenshots` job
  # above, and uploads a side-by-side parity-report.html. Report-only
  # (`continue-on-error`) — this never blocks a merge, it just surfaces
  # divergence for a human to look at.
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: screenshots
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install harness deps
        run: npm ci

      - name: Run harness unit tests
        run: npm run test:parity

      - name: Download app screenshots
        uses: actions/download-artifact@v4
        with:
          name: app-screenshots
          path: app-shots

      # xcresulttool/xcparse export attachments as UUID-named files plus a
      # manifest.json mapping each exportedFileName to a
      # suggestedHumanReadableName like `app-tab-library_0_<UUID>.png`.
      # parity_diff.js needs real `app-<id>.png` names, so recover them here
      # before diffing.
      - name: Rename app screenshots to app-<id>.png
        run: node scripts/rename_app_shots.js app-shots app-shots-renamed

      # `npm ci`'s puppeteer postinstall usually fetches Chromium, but this
      # is a fresh Linux runner (not the macOS runners the rest of this
      # workflow uses) — install explicitly so a skipped postinstall doesn't
      # silently sink "Render proofs". No-op if Chromium is already present.
      - name: Ensure Chromium is installed for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Render proofs
        run: |
          node scripts/render_proofs.js \
            --canvas "docs/design/Gym Sync App Designs.dc.html" \
            --design-dir docs/design \
            --out proofs

      # Redesign (2026-07-20): render the Onyx proof phones as frames 60-68 in
      # the SAME proofs dir — frame-map.json points redesigned screen ids here,
      # so those pairs diff against their real authority instead of the
      # superseded Ink canvas (docs/design/mockups/README.md).
      - name: Render redesign (Onyx) proofs
        run: node scripts/render_redesign_proofs.js --out proofs

      - name: Diff and report
        run: |
          node scripts/parity_diff.js \
            --app app-shots-renamed \
            --proofs proofs \
            --map docs/design/frame-map.json \
            --accepted docs/design/accepted-deviations.json \
            --out parity-out

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: parity-out
          if-no-files-found: warn

  deploy-testflight:
    runs-on: macos-15
    timeout-minutes: 45
    needs: build-test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      # App Store Connect rejects uploads built with SDKs older than iOS 26.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Must run BEFORE xcodegen (source list fixed at generate time).
      # TestSecrets stub keeps the project generatable; test target isn't built for archive.
      - name: Write Secrets.swift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # OPTIONAL — see the build-test job's identical step above for why
          # no `|| ''` fallback is needed.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          printf 'import Foundation\n\nenum Secrets {\n    static let supabaseURL = URL(string: "%s")!\n    static let supabaseAnonKey = "%s"\n    static let sentryDSN = "%s"\n}\n' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" "$SENTRY_DSN" > GymSyncApp/GymSync/Config/Secrets.swift
          cp GymSyncApp/GymSyncTests/TestSecrets.swift.template GymSyncApp/GymSyncTests/TestSecrets.swift

      - name: Generate Xcode project from project.yml
        run: xcodegen generate --spec GymSyncApp/project.yml --project GymSyncApp

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_API_KEY" > ~/private_keys/AuthKey_57G3DK86PA.p8

      # Import the stable Apple Development signing cert so automatic signing REUSES it
      # instead of minting a new "Created via API" cert per run (Apple caps certs per
      # account — the cap was hit on 2026-07-12 and blocked the deploy).
      - name: Import signing certificate into temporary keychain
        env:
          IOS_SIGNING_CERT_P12: ${{ secrets.IOS_SIGNING_CERT_P12 }}
          IOS_SIGNING_CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$IOS_SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$IOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive (automatic signing via ASC API key)
        working-directory: GymSyncApp
        run: |
          xcodebuild archive \
            -project GymSync.xcodeproj \
            -scheme GymSync \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GymSync.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_57G3DK86PA.p8" \
            -authenticationKeyID 57G3DK86PA \
            -authenticationKeyIssuerID d0ee236a-ef18-498e-8d99-26b47c70d4f0 \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # Symbolication (Sentry triage 2026-08-31). Without dSYMs, EVERY
      # first-party frame in a Sentry crash renders as `<redacted>` — which
      # is precisely why GYMSYNC-D9 (a stack overflow in Swift generic-type
      # metadata, reached through ZStack.init on the Home tab) could not be
      # pinned to a specific view: the app frames carrying that answer were
      # unresolvable. The archive's dSYMs are the only artifact that fixes
      # that, and they exist only here, so they upload here.
      #
      # Guarded rather than `if:`-gated on the secret so a missing token
      # SKIPS symbolication instead of failing a deploy — same defensive
      # idiom as this workflow's `if [ -n "$SUPABASE_URL" ]` secret writes.
      # Requires repo secret SENTRY_AUTH_TOKEN (org:mattaniah, scope
      # project:releases). Until it exists, this step is a logged no-op.
      - name: Upload dSYMs to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN unset - skipping dSYM upload. Crashes from build ${{ github.run_number }} will stay unsymbolicated."
            exit 0
          fi
          npx --yes @sentry/cli@latest debug-files upload \
            --org mattaniah \
            --project gymsync \
            "$RUNNER_TEMP/GymSync.xcarchive/dSYMs"

      # ExportOptions.plist has destination:upload — this step also uploads to TestFlight.
      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GymSync.xcarchive" \
            -exportOptionsPlist GymSyncApp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_57G3DK86PA.p8" \
            -authenticationKeyID 57G3DK86PA \
            -authenticationKeyIssuerID d0ee236a-ef18-498e-8d99-26b47c70d4f0

  # App Store watch screenshots ([watch-shot] commits only): builds the
  # real watch app, launches it in the watch simulator with the debug
  # --marketing-demo seed, and captures the actual rendered UI. Never a
  # mock-up - guideline 2.3.3 wants the app as it really renders, so the
  # screenshot comes from the binary, with demo state driven through the
  # same fixture idea the iPhone marketing suite uses.
  watch-screenshot:
    if: contains(github.event.head_commit.message, '[watch-shot]')
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The watch target compiles no secrets, but the generated project
      # lists the iOS target too - keep its template files present.
      - name: Placeholder secrets
        run: |
          cp GymSyncApp/GymSync/Config/Secrets.swift.template GymSyncApp/GymSync/Config/Secrets.swift || true
          cp GymSyncApp/GymSyncTests/TestSecrets.swift.template GymSyncApp/GymSyncTests/TestSecrets.swift || true

      - name: Generate Xcode project from project.yml
        run: xcodegen generate --spec GymSyncApp/project.yml --project GymSyncApp

      - name: Build watch app for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project GymSyncApp/GymSync.xcodeproj \
            -scheme GymSyncWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO | tail -20

      - name: Launch in watch simulator and capture
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "Apple Watch (Ultra|Series)" | head -1 | grep -oE "[0-9A-F-]{36}")
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes | grep watchOS | tail -1 | grep -oE "com.apple.CoreSimulator.SimRuntime.watchOS[0-9-]*")
            UDID=$(xcrun simctl create "MarketingWatch" "Apple Watch Ultra 2 (49mm)" "$RUNTIME")
          fi
          echo "sim: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find DerivedData/Build/Products -name "GymSyncWatch.app" -maxdepth 2 | head -1)
          echo "app: $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" app.gymsync.ios.watchkitapp --marketing-demo
          sleep 8
          mkdir -p watch-shots
          xcrun simctl io "$UDID" screenshot watch-shots/watch-whose-turn.png
          xcrun simctl io "$UDID" screenshot --type png watch-shots/watch-whose-turn-2.png || true
          ls -la watch-shots

      - name: Upload watch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: watch-screenshot
          path: watch-shots/
