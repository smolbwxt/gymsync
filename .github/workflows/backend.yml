name: Backend

on:
  push:
    paths:
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/**"
      - ".github/workflows/backend.yml"

jobs:
  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run pgTAP suite (all tests roll back)
        run: node scripts/run_pgtap.js
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deno-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [push-dispatcher, livekit-token, account-deletion-cascade]
    defaults:
      run:
        working-directory: supabase/functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.2"
      - name: deno test
        run: deno test
      - name: deno check
        run: deno check *.ts
      - name: deno lint
        run: deno lint

  deploy-functions:
    needs: [pgtap, deno-test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check deploy token is configured
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::notice::SUPABASE_ACCESS_TOKEN secret not configured yet — skipping deploy."
          exit 0
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Deploy push-dispatcher, livekit-token, and account-deletion-cascade
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy push-dispatcher livekit-token account-deletion-cascade clip-sweeper --project-ref chjkkwqwdlmaxacwglzm
